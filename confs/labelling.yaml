job:
  KIND: labelling

  # input parameters
  input_train_top_labels:
    KIND: parquet
    path: data/silver/silver_train_top_labels_df.parquet
    limit: 200 
  input_test_top_labels:
    KIND: parquet
    path: data/silver/silver_test_top_labels_df.parquet
    limit: 50
  
  # output parameters
  output_train_df:
    KIND: csv 
    path: data/gold/gold_train_df.csv
  output_test_df:
    KIND: csv 
    path: data/gold/gold_test_df.csv

  # model parameters
  base_url: https://openrouter.ai/api/v1
  models:
    - openai/gpt-5-nano
    - google/gemini-2.0-flash-lite-001
    - deepseek/deepseek-chat-v3.1
    - meta-llama/llama-4-maverick
    - x-ai/grok-4-fast
  template_path: prompts/example_prompt.txt
  context_columns: ['title', 'abstract']
  label_column: top_labels
  batch_size: 10 
  majority_threshold: 3

  # cost parameters
  max_cost: 2
  expected_output_token_length: 2
  models_csv_path: data/models.csv